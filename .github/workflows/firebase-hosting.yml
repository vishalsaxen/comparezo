# Publishes the front end (public/) to Firebase Hosting at https://comparezo.web.app
# whenever main changes. Needs a repository secret FIREBASE_SERVICE_ACCOUNT holding a
# service account key for the "comparezo" Firebase project (the same JSON as on Render works
# if that account has the Firebase Hosting Admin role).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
    paths: ['public/**', 'firebase.json', '.firebaserc', '.github/workflows/firebase-hosting.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: comparezo
          channelId: live
